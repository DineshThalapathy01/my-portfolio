<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Resume Viewer & ATS Checker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="app-shell">
    <header class="app-header">
        <div class="brand">
            <h1 class="brand-title">Resume — S Dinesh Kumar</h1>
        </div>
        <nav class="app-nav">
            <a href="index.html">Home</a>
            <a href="templates/about.html">About</a>
            <a href="templates/projects.html">Projects</a>
            <a href="templates/contact.html">Contact</a>
            <a href="resume_checker.html" class="active">Resume</a>
        </nav>
    </header>

    <main class="page-main resume-checker">
        <section class="section-card resume-grid">
            <div class="resume-view">
                <div class="resume-view-head">
                    <div>
                        <span class="eyebrow">Resume</span>
                        <h2 style="margin:.2rem 0 .4rem 0">S Dinesh Kumar</h2>
                    </div>
                    <div class="resume-actions">
                        <a class="btn" href="S Dinesh Kumar.pdf" target="_blank" rel="noopener">Open</a>
                        <a class="btn btn-primary" href="S Dinesh Kumar.pdf" download="S_Dinesh_Kumar_Resume.pdf">Download</a>
                    </div>
                </div>

                <div class="resume-frame">
                    <iframe id="resumeIframe" src="S%20Dinesh%20Kumar.pdf" title="Resume"></iframe>
                </div>
                <p class="muted" style="margin-top:.6rem">The site PDF is used for ATS checks by default; you may paste text or run the default check.</p>
            </div>

            <aside class="ats-panel">
                <div class="ats-header">
                    <span class="eyebrow">ATS Checker</span>
                    <div class="ats-score">
                        <div><strong>Score</strong></div>
                        <div class="score-value" id="scoreValue">—</div>
                        <div class="score-bar" aria-hidden="true"><div id="scoreBar"></div></div>
                    </div>
                </div>

                <div class="form-block">
                    <label>External ATS (optional)</label>
                    <select id="providerSelect" class="form-control">
                        <option value="local">Local (built-in) — no key required</option>
                        <option value="openai">OpenAI (requires key)</option>
                        <option value="hf">HuggingFace (requires key)</option>
                        <option value="anthropic">Anthropic (requires key)</option>
                    </select>
                    <form id="apiKeyForm" onsubmit="return false;" class="form-inline">
                      <input id="apiKeyInput" type="password" placeholder="Paste provider API key (session only)" />
                      <label class="small-muted"><input id="saveKey" type="checkbox" /> Remember</label>
                    </form>
                </div>

                <div class="form-block">
                    <label>Resume text (optional)</label>
                    <textarea id="resumeText" placeholder="(extracted text will appear here)" class="small-textarea"></textarea>
                </div>

                <div class="ats-controls">
                    <button id="runChecks" class="btn btn-primary">Run checks</button>
                    <button id="clearText" class="btn">Clear</button>
                </div>

                <div id="results" class="results-box"></div>
            </aside>
        </section>
    </main>

    <footer class="app-footer">Designed & Maintained by S Dinesh Kumar.</footer>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
        <script>
            if(window.pdfjsLib){
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            }
        </script>
        <script src="script_resume_checker.js"></script>
</body>
</html>
